<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Notes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .container {
            width: 60%;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #333;
        }
        .note {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 5px solid #00aaff;
        }
        .buttons {
            display: flex;
            gap: 10px;
        }
        .note a {
            text-decoration: none;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
        }
        .view-btn {
            background: #ffaa00;
        }
        .view-btn:hover {
            background: #cc8800;
        }
        .download-btn {
            background: #00aaff;
        }
        .download-btn:hover {
            background: #0088cc;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            background: #ff4d4d;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
        }
        .back-btn:hover {
            background: #cc0000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Web Design & Development Notes</h2>

        <div class="note">
            <span>HTML Basics</span>
            <div class="buttons">
                <a href="notes/html_basics.pdf" target="_blank" class="view-btn">View</a>
                <a href="notes/html_basics.pdf" download class="download-btn">Download</a>
            </div>
        </div>
        <div class="note">
            <span>CSS Fundamentals</span>
            <div class="buttons">
                <a href="notes/css_fundamentals.pdf" target="_blank" class="view-btn">View</a>
                <a href="notes/css_fundamentals.pdf" download class="download-btn">Download</a>
            </div>
        </div>
        <div class="note">
            <span>JavaScript Essentials</span>
            <div class="buttons">
                <a href="notes/javascript_essentials.pdf" target="_blank" class="view-btn">View</a>
                <a href="notes/javascript_essentials.pdf" download class="download-btn">Download</a>
            </div>
        </div>
        <div class="note">
            <span>Responsive Design</span>
            <div class="buttons">
                <a href="notes/responsive_design.pdf" target="_blank" class="view-btn">View</a>
                <a href="notes/responsive_design.pdf" download class="download-btn">Download</a>
            </div>
        </div>

        <a href="course3.html" class="back-btn">⬅ Back to Course</a>
    </div>

</body>
</html>
