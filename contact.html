    <div class="container">
        <h2>Contact For Any Query</h2>
        <div class="contact-details">
            <div class="contact-info">
                <h3>Get In Touch</h3>
                <p><strong>Office:</strong> ADYPU</p>
                <p><strong>Mobile:</strong> 952901****</p>
                <p><strong>Email:</strong> learnwithrohit@gmail.com</p>
            </div>

          




            <form id="contactForm">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <input type="text" name="subject" placeholder="Subject" required>
                <textarea name="message" rows="5" placeholder="Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        
            <script>
                document.getElementById("contactForm").addEventListener("submit", function (event) {
                    event.preventDefault();
        
                    var formData = new FormData(event.target);
                    var data = {};
                    formData.forEach((value, key) => { data[key] = value });
        
                    fetch("https://script.google.com/macros/s/AKfycbx2_DLqSg0pyj-vOH7hrJJDA024ozqMaIVHLxKdKNZhVOtvPlqJSZETHQrCcEQwRtUz/exec", {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(data)
                    }).then(() => {
                        alert("Your message has been sent successfully!");
                        event.target.reset();
                    }).catch(error => {
                        console.error("Error:", error);
                        alert("There was an error submitting your message.");
                    });
                });
            </script>














        </div>
       
        
        <!-- Success Popup -->

            background:#4CAF50; color:white; padding:20px; border-radius:5px;">
            Message Sent Successfully!
        </div>
